<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام الحضور الجامعي</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app"><div id="loading" class="loading">جارٍ تحميل النظام...</div>
<section id="loginView" class="auth-wrap hidden"><div class="auth-card"><div class="brand"><span>UA</span><div><b>نظام الحضور الجامعي</b><small>University Attendance</small></div></div><h1>تسجيل الدخول</h1><form id="loginForm"><label>البريد الإلكتروني<input id="loginEmail" type="email" required></label><label>كلمة المرور<input id="loginPassword" type="password" required></label><button class="primary full">تسجيل الدخول</button></form><button id="forgotBtn" class="link-btn">نسيت كلمة المرور؟</button><hr><button id="showRegister" class="secondary full">إنشاء حساب</button><div id="authMsg" class="msg"></div></div></section>
<section id="registerView" class="auth-wrap hidden"><div class="auth-card wide"><div class="brand"><span>UA</span><div><b>إنشاء حساب</b></div></div><div class="role-tabs"><button class="active" data-reg-role="student">طالب</button><button data-reg-role="doctor">دكتور/دكتورة</button></div><form id="registerForm"><input type="hidden" id="regRole" value="student"><div class="two"><label>الاسم الكامل / الرباعي<input id="regName" required></label><label>البريد الإلكتروني<input id="regEmail" type="email" required></label></div><div class="two"><label>كلمة المرور<input id="regPassword" type="password" minlength="6" required></label><label>تأكيد كلمة المرور<input id="regPassword2" type="password" minlength="6" required></label></div><div id="studentFields"><div class="two"><label>الرقم الجامعي<input id="studentId"></label><label>القسم<input id="department"></label></div><div class="two"><label>الفرقة<input id="level"></label><label>الشعبة<input id="section"></label></div></div><div id="doctorFields" class="hidden"><div class="two"><label>القسم/التخصص<input id="doctorDepartment"></label><label>رقم الهاتف<input id="doctorPhone"></label></div></div><button class="primary full">إنشاء الحساب</button></form><button id="showLogin" class="link-btn">العودة لتسجيل الدخول</button><div id="regMsg" class="msg"></div></div></section>
<section id="dashboardView" class="hidden"><header class="topbar"><div class="brand mini"><span>UA</span><div><b>نظام الحضور الجامعي</b><small id="roleLabel"></small></div></div><div class="top-actions"><span id="userNameTop"></span><button id="logoutBtn" class="danger">خروج</button></div></header><div class="layout"><aside id="sidebar" class="sidebar"></aside><main id="main" class="main"></main></div></section></div>
<div id="toast" class="toast"></div><div id="modal" class="modal hidden"><div class="modal-box"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div><footer class="footer">Developed by <a href="https://eng-a7med-ashraf.vercel.app/" target="_blank">A7MED ASHRAF</a> · <a href="tel:01080343968">01080343968</a></footer><script type="module" src="app.js"></script></body></html>
